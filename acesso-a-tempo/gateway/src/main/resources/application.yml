server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Todos os pedidos entram pela gateway. Cada rota encaminha para o endereço
          # do serviço em acesso.servicos (localhost por omissão, nome do Service no k8s).
          #
          # Os recursos da API não têm prefixo de serviço (ex.: /pedidos, não
          # /referenciacao/pedidos), por isso cada rota junta a landing do serviço
          # (/nome-do-servico/landing) e os seus recursos.
          routes:
            - id: referenciacao
              uri: ${acesso.servicos.referenciacao}
              predicates:
                - Path=/referenciacao/landing,/pedidos/**
            - id: agendamento
              uri: ${acesso.servicos.agendamento}
              predicates:
                - Path=/agendamento/landing,/agendas/**,/marcacoes/**
            - id: lista-espera
              uri: ${acesso.servicos.lista-espera}
              predicates:
                - Path=/lista-espera/landing,/episodios/**
            - id: gestao-acesso
              uri: ${acesso.servicos.gestao-acesso}
              predicates:
                - Path=/gestao-acesso/landing,/regras/**,/prazos/**,/monitorizacao/**,/demo/**
            - id: garantia-acesso
              uri: ${acesso.servicos.garantia-acesso}
              predicates:
                - Path=/garantia-acesso/landing,/casos/**,/instituicoes/**,/transferencias/**
            - id: historico
              uri: ${acesso.servicos.historico}
              predicates:
                - Path=/historico/landing,/historico/**,/indicadores/**
            - id: utentes
              uri: ${acesso.servicos.utentes}
              predicates:
                - Path=/utentes/**
            - id: notificacoes
              uri: ${acesso.servicos.notificacoes}
              predicates:
                - Path=/notificacoes/**,/modelos/**,/lembretes/**
            # Rota temporária, enquanto o módulo servico-modelo existir.
            - id: servico-modelo
              uri: ${acesso.servicos.servico-modelo}
              predicates:
                - Path=/servico-modelo/**

# Endereços dos serviços. Por omissão (perfil local), cada um no seu porto em
# localhost; no perfil k8s, o nome do Service do Kubernetes.
acesso:
  servicos:
    referenciacao: http://localhost:8081
    agendamento: http://localhost:8082
    lista-espera: http://localhost:8083
    gestao-acesso: http://localhost:8084
    garantia-acesso: http://localhost:8085
    historico: http://localhost:8086
    utentes: http://localhost:8087
    notificacoes: http://localhost:8088
    servico-modelo: http://localhost:8099

  # Autorização (P2): o cabeçalho X-Utilizador traz <id>;<PAPEL>.
  # Os GET estão abertos a todos os papéis. Os outros métodos só passam se a
  # operação estiver em permissoes e o papel for um dos indicados; senão, 403.
  autorizacao:
    # Passam sem cabeçalho X-Utilizador
    caminhos-livres:
      - /*/landing
      - /actuator/**
    permissoes:
      - { metodo: POST,   caminho: /pedidos,                          papeis: [MEDICO_FAMILIA] }
      - { metodo: PUT,    caminho: /pedidos/*/triagem,                papeis: [TRIADOR] }
      - { metodo: PUT,    caminho: /pedidos/*/prioridade,             papeis: [TRIADOR] }
      - { metodo: POST,   caminho: /agendas,                          papeis: [ADMINISTRATIVO, GESTOR_ACESSO] }
      - { metodo: POST,   caminho: /marcacoes,                        papeis: [ADMINISTRATIVO, DIRETOR_SERVICO, GESTOR_ACESSO] }
      - { metodo: PUT,    caminho: /marcacoes/*/realizacao,           papeis: [ADMINISTRATIVO, DIRETOR_SERVICO] }
      - { metodo: DELETE, caminho: /marcacoes/*,                      papeis: [ADMINISTRATIVO, DIRETOR_SERVICO] }
      - { metodo: POST,   caminho: /episodios/*/saida,                papeis: [ADMINISTRATIVO, GESTOR_ACESSO] }
      - { metodo: POST,   caminho: /regras,                           papeis: [GESTOR_ACESSO] }
      - { metodo: PUT,    caminho: /demo/relogio,                     papeis: [GESTOR_ACESSO] }
      - { metodo: DELETE, caminho: /demo/relogio,                     papeis: [GESTOR_ACESSO] }
      - { metodo: PUT,    caminho: /casos/*/alerta-diretor,           papeis: [GESTOR_ACESSO] }
      - { metodo: POST,   caminho: /casos/*/transferencias,           papeis: [GESTOR_ACESSO] }
      - { metodo: PUT,    caminho: /transferencias/*/resposta,        papeis: [GESTOR_ACESSO] }
      - { metodo: POST,   caminho: /utentes,                          papeis: [ADMINISTRATIVO] }
      - { metodo: PUT,    caminho: /utentes/*/contactos,              papeis: [ADMINISTRATIVO] }
      - { metodo: PUT,    caminho: /utentes/*/consentimentos,         papeis: [ADMINISTRATIVO] }
      - { metodo: POST,   caminho: /notificacoes/*/reenvio,           papeis: [ADMINISTRATIVO, GESTOR_ACESSO] }
      - { metodo: PUT,    caminho: /modelos/*,                        papeis: [ADMINISTRATIVO, GESTOR_ACESSO] }

# Os endereços vêm de acesso.servicos, por isso a gateway não usa o Eureka.
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: k8s
acesso:
  servicos:
    referenciacao: http://referenciacao:8081
    agendamento: http://agendamento:8082
    lista-espera: http://lista-espera:8083
    gestao-acesso: http://gestao-acesso:8084
    garantia-acesso: http://garantia-acesso:8085
    historico: http://historico:8086
    utentes: http://utentes:8087
    notificacoes: http://notificacoes:8088
    servico-modelo: http://servico-modelo:8099
