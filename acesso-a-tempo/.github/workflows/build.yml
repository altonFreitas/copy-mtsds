name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Formatação, compilação e testes
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dspotless.apply.skip=true spotless:check verify
