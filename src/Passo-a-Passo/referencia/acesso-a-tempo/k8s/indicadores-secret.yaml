# Secret: dados SENSÍVEIS do serviço indicadores (aula 06: Secret).
# stringData aceita texto simples; o Kubernetes guarda-o em base64 (NÃO é encriptação!).
# Valores de DESENVOLVIMENTO: numa entrega real não se faz commit de passwords reais.
apiVersion: v1
kind: Secret
metadata:
  name: indicadores-secret
  labels:
    app: indicadores
type: Opaque
stringData:
  DB_USER: "indicadores_user"
  DB_PASSWORD: "indicadores_pass"
  RABBIT_USER: "user"
  RABBIT_PASSWORD: "123"
